    <!--
      The app is a single page with hash routing, so `#/about` and `#/theory`
      are not separately indexable: to a crawler they are all this one URL.
      That is why `npm run build` also emits static copies of every page at real
      paths (see scripts/seo.ts) — those carry the content and the per-page
      canonicals. This shell canonicalises to the site root and points at them.
    -->
    <link rel="canonical" href="https://tansuozcelebi.github.io/MechanismDesigner/" />
    <link
      rel="alternate"
      hreflang="tr"
